services:
  postgres-a:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      PGPASSWORD: postgres
    # Postgres A will wait for a wal subscriber to send the ack up to wal_sender_timeout
    command: postgres -c wal_level=logical -c wal_sender_timeout=120s
    ports:
      - "5432:5432"
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
      - ./a:/docker-entrypoint-initdb.d:ro

  postgres-b:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      PGPASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
      - ./b:/docker-entrypoint-initdb.d:ro
    # Sin depends_on: A y B se prenden y apagan de forma independiente.
    # La primera vez, b/00_wait-for-a.sh espera a A antes de crear la subscription.

# Los volúmenes sobreviven a `docker rm -f` y se borran con `down -v`
volumes:
  postgres-a-data:
  postgres-b-data:
